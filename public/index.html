<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.css"
        integrity="sha256-M2GksIxiyP3cpwMSJed56ChJE0wDoGhesQnU1FnfGd8=" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Погода</h1>

    <form id="search" class="search" autocomplete="off">
      <select id="country" aria-label="Країна">
        <option value="">Будь-яка країна</option>
      </select>
      <input id="city" type="text" placeholder="Введи місто, напр. Kyiv, Lviv, London" required maxlength="100">
      <button type="submit">Шукати</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="current" class="card current" hidden>
      <div class="current-main">
        <img id="cur-icon" alt="" width="100" height="100">
        <div>
          <h2 id="cur-city"></h2>
          <p id="cur-desc" class="desc"></p>
        </div>
        <div id="cur-temp" class="temp"></div>
      </div>
      <dl class="stats">
        <div><dt>Відчувається як</dt><dd id="cur-feels"></dd></div>
        <div><dt>Вологість</dt><dd id="cur-humidity"></dd></div>
        <div><dt>Вітер</dt><dd id="cur-wind"></dd></div>
        <div><dt>Тиск</dt><dd id="cur-pressure"></dd></div>
      </dl>
    </section>

    <section id="forecast" hidden>
      <h3>Прогноз на 3 дні</h3>
      <div id="days" class="days"></div>
    </section>

    <section id="map-section" hidden>
      <h3>Карта погоди</h3>
      <div id="layers" class="layers" role="group" aria-label="Шар карти">
        <button type="button" data-layer="wind_anim" class="active">Вітер ➤ анімація</button>
        <button type="button" data-layer="precip_grid">Опади (прогноз)</button>
        <button type="button" data-layer="temp_grid">Температура (прогноз)</button>
        <button type="button" data-layer="precipitation_new">Опади (зараз)</button>
        <button type="button" data-layer="clouds_new">Хмари</button>
        <button type="button" data-layer="wind_new">Вітер (кольори)</button>
        <button type="button" data-layer="temp_new">Температура (зараз)</button>
        <button type="button" data-layer="pressure_new">Тиск</button>
      </div>
      <div id="map" class="map"></div>
      <div id="timeline" class="timeline">
        <button type="button" id="play" aria-label="Відтворити">▶</button>
        <input type="range" id="hour" min="0" max="71" value="0" step="1" aria-label="Година прогнозу">
        <span id="hour-label" class="hour-label"></span>
      </div>
      <div id="legend" class="legend" hidden>
        <span id="legend-title" class="legend-title"></span>
        <div id="legend-scale" class="legend-scale"></div>
      </div>
      <p id="map-hint" class="map-hint"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"
          integrity="sha256-TpmNTyB+ACOS5pMIYgAMzQvCDl1KU4xULsb2/Jjej74=" crossorigin="anonymous"></script>
  <script src="scalarFieldLayer.js"></script>
  <script src="app.js"></script>
</body>
</html>
